server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: cr-gateway
  codec:
    max-in-memory-size: 25MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
    gateway:
      discovery:
        locator:
          enabled: false  # 关闭自动路由，手动配置
      routes:
        # 用户服务
        - id: cr-user
          uri: lb://cr-user
          predicates:
            - Path=/api/user/**
        # 图片服务
        - id: cr-image
          uri: lb://cr-image
          predicates:
            - Path=/api/image/**
        # 图片静态资源
        - id: cr-image-uploads
          uri: lb://cr-image
          predicates:
            - Path=/uploads/**
        # 推荐服务
        - id: cr-recommend
          uri: lb://cr-recommend
          predicates:
            - Path=/api/recommend/**
        # 通知服务
        - id: cr-notification
          uri: lb://cr-notification
          predicates:
            - Path=/api/notification/**
      # 跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
  redis:
    host: localhost
    port: 6379
    database: 0

auth:
  whitelist:
    - /api/user/login
    - /api/user/register
    - /api/image/list
    - /api/image/*
    - /api/image/category/list
    - /uploads/**
    - /api/recommend/hot
    - /*/v2/api-docs
    - /swagger-resources/**
    - /webjars/**
    - /swagger-ui.html
    - /doc.html
    - /favicon.ico

knife4j:
  gateway:
    enabled: true
    strategy: discover
    discover:
      enabled: true
      version: Swagger2
